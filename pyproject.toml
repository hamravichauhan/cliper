[project]
name = "kalp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ravi", email = "ravi486chauhan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "mediapipe>=1.2.2",
    "mlx-whisper>=0.4.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.0",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scenedetect>=0.7.3",
    "scipy>=1.17.1",
    "sentence-transformers>=6.2.0",
    "soundfile>=0.14.0",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
cliplocal = "src.cliplocal.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
